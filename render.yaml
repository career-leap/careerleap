# Render Blueprint for CareerLeap
# This file defines the infrastructure for deploying CareerLeap on Render
# Note: The database must be created separately first, then add DATABASE_URL manually

services:
  # Django Backend Web Service
  - type: web
    name: careerleap-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "./backend_django/build.sh"
    startCommand: "cd backend_django && gunicorn backend_django.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      # IMPORTANT: Set DATABASE_URL manually after creating PostgreSQL
      # Format: postgres://username:password@host:port/database
      
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "careerleap-backend.onrender.com,career-leap.academy,www.career-leap.academy"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://careerleap-frontend.onrender.com,https://career-leap.academy,https://www.career-leap.academy"
      - key: FRONTEND_URL
        value: "https://career-leap.academy"
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: JWT_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Email configuration — Resend (https://resend.com)
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.resend.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "resend"
      # RESEND_API_KEY: Set this manually in Render dashboard after creating your Resend account
      - key: DEFAULT_FROM_EMAIL
        value: "info@career-leap.academy"
    healthCheckPath: /admin/login/
    
  # React Frontend Static Site
  - type: web
    name: careerleap-frontend
    runtime: static
    buildFilter:
      paths:
        - src/**
        - public/**
        - package*.json
        - vite.config.js
        - tailwind.config.js
        - index.html
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "/api"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://careerleap-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
